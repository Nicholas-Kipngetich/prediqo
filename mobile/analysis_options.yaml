include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
    always_declare_return_types: true

analyzer:
  errors:
    todo: ignore
    # Flutter 3.50 deprecates material.dart in favour of material_ui.dart.
    # The design system still uses Material widgets; migrate in a later phase.
    deprecated_member_use: ignore
