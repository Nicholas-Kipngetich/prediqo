name: prediqo
description: "Prediqo — AI-powered football analytics and prediction platform."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Phase 1 keeps only the dependencies actually used by the foundation.
# Firebase, Hive, fl_chart and code generation are added in Phase 4 with
# `flutter pub add` so their versions are resolved against the installed SDK.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  dio: ^5.7.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  google_mobile_ads: ^9.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
