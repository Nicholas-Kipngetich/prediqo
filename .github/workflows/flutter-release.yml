name: Flutter Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production API base URL
        required: false
        default: https://api.prediqo.app
      dev_bypass_auth:
        description: Skip sign-in for local UI testing
        type: boolean
        required: false
        default: false
      skip_firebase:
        description: Skip Firebase native init (local test builds)
        type: boolean
        required: false
        default: false
      skip_ads:
        description: Skip AdMob native init (local test builds)
        type: boolean
        required: false
        default: false
      minimal_diagnostic:
        description: Build a diagnostic APK with no Firebase/AdMob plugins
        type: boolean
        required: false
        default: false
      lite_full_app:
        description: Build the full app with native Firebase/AdMob plugins removed
        type: boolean
        required: false
        default: false

jobs:
  build-appbundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform folder
        # The repository intentionally does not commit generated platform files.
        # Without --overwrite, existing lib/ and test/ sources are preserved.
        run: flutter create . --project-name prediqo --org com.prediqo --platforms android

      - name: Provide Firebase Android config
        if: inputs.minimal_diagnostic != true
        run: cp mobile/android/app/google-services.json android/app/google-services.json

      - name: Ensure INTERNET permission
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perm = '<uses-permission android:name=\"android.permission.INTERNET\"/>'
          if perm not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          open(p, 'w').write(s)
          "

      - name: Use minimal diagnostic entry point
        if: inputs.minimal_diagnostic == true
        run: |
          cp lib/main_minimal.dart lib/main.dart
          sed -i '/firebase_core:/d; /firebase_auth:/d; /google_sign_in:/d; /google_mobile_ads:/d; /shared_preferences:/d' pubspec.yaml

      - name: Use lite full app sources
        if: inputs.lite_full_app == true
        run: |
          cp lib/lite/main_lite.dart lib/main.dart
          cp lib/lite/auth_service_lite.dart lib/core/auth_service.dart
          cp lib/lite/ads_lite.dart lib/core/ads.dart
          cp lib/lite/ad_banner_lite.dart lib/widgets/ad_banner.dart

      - name: Disable release lint task
        # AGP 8 lint crashes while analysing firebase_core sources on this runner.
        # checkReleaseBuilds=false skips that non-essential analysis task.
        run: |
          python3 -c "
          import os
          p = 'android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace('android {', 'android {\n    lint { checkReleaseBuilds = false }', 1)
          open(p, 'w').write(s)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: inputs.minimal_diagnostic != true
        run: flutter analyze || true

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release --no-shrink \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || secrets.API_BASE_URL || 'https://api.prediqo.app' }} \
            --dart-define=DEV_BYPASS_AUTH=${{ inputs.dev_bypass_auth }} \
            --dart-define=SKIP_FIREBASE=${{ inputs.skip_firebase }} \
            --dart-define=SKIP_ADS=${{ inputs.skip_ads }}

      - name: Build release APK for device testing
        run: |
          flutter build apk --release --no-shrink \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || secrets.API_BASE_URL || 'https://api.prediqo.app' }} \
            --dart-define=DEV_BYPASS_AUTH=${{ inputs.dev_bypass_auth }} \
            --dart-define=SKIP_FIREBASE=${{ inputs.skip_firebase }} \
            --dart-define=SKIP_ADS=${{ inputs.skip_ads }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: prediqo-appbundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: prediqo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
