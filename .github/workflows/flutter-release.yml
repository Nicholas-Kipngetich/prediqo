name: Flutter Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production API base URL
        required: false
        default: https://api.prediqo.app
      dev_bypass_auth:
        description: Skip sign-in for local UI testing
        type: boolean
        required: false
        default: false

jobs:
  build-appbundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform folder
        # The repository intentionally does not commit generated platform files.
        # Without --overwrite, existing lib/ and test/ sources are preserved.
        run: flutter create . --project-name prediqo --org com.prediqo --platforms android

      - name: Provide Firebase Android config
        run: cp firebase/google-services.example.json android/app/google-services.json

      - name: Disable release lint task
        # AGP 8 lint crashes while analysing firebase_core sources on this runner.
        # checkReleaseBuilds=false skips that non-essential analysis task.
        run: |
          python3 -c "
          import os
          p = 'android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace('android {', 'android {\n    lint { checkReleaseBuilds = false }', 1)
          open(p, 'w').write(s)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release --no-shrink \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || secrets.API_BASE_URL || 'https://api.prediqo.app' }} \
            --dart-define=DEV_BYPASS_AUTH=${{ inputs.dev_bypass_auth }}

      - name: Build release APK for device testing
        run: |
          flutter build apk --release --no-shrink \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || secrets.API_BASE_URL || 'https://api.prediqo.app' }} \
            --dart-define=DEV_BYPASS_AUTH=${{ inputs.dev_bypass_auth }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: prediqo-appbundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: prediqo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
