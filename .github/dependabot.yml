version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]

  - package-ecosystem: pip
    directory: /ai-engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ai-ml"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "mobile"]

  - package-ecosystem: npm
    directory: /admin-dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "admin"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
